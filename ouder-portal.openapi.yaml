components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST https://inloggen.somtoday.nl/oauth2/token`.
        Lifetime is about 3600 seconds.

  parameters:
    additional:
      name: additional
      in: query
      description: Repeat to expand `additionalObjects`. Known values include `adres`, `restricties`, `impersonated`, `toonToestemmingReminder`, `stamgroep`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    leerlingId:
      name: leerlingId
      in: path
      required: true
      description: Numeric student id, not the UUID
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    jaar:
      name: jaar
      in: path
      required: true
      schema:
        type: integer
        example: 2026
    week:
      name: week
      in: path
      required: true
      description: ISO week number
      schema:
        type: integer
    jaarWeek:
      name: jaarWeek
      in: query
      required: true
      description: "`{year}~{isoWeek}`, for example `2026~41`"
      schema:
        type: string
    jaarWeekOptional:
      name: jaarWeek
      in: query
      schema:
        type: string
    leerlingFilter:
      name: geenDifferentiatieOfGedifferentieerdVoorLeerling
      in: query
      required: true
      description: Numeric student id. Returns items with no differentiation plus items differentiated for this student.
      schema:
        type: string
    studiewijzerAdditionals:
      name: additional
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - leerlingen
            - swigemaaktVinkjes
            - lesgroep
            - leerlingenMetInleveringStatus
            - leerlingProjectgroep
            - studiewijzerId
    amount:
      name: amount
      in: query
      schema:
        type: integer
        example: 25
    start:
      name: start
      in: query
      schema:
        type: integer
        example: 0
    vakUuid:
      name: vakUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    lichtingUuid:
      name: lichtingUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    plaatsingUuid:
      name: plaatsingUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    resultaatSort:
      name: sort
      in: query
      schema:
        type: string
        example: desc-geldendResultaatCijferInvoer
    resultaatTypesRecent:
      name: type
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [Toetskolom, DeeltoetsKolom, Werkstukcijferkolom, Advieskolom]
    resultaatAdditionalsRecent:
      name: additional
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [vaknaam, resultaatkolom, naamalternatiefniveau, vakuuid, lichtinguuid]
    resultaatTypesVak:
      name: type
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - Toetskolom
            - SamengesteldeToetsKolom
            - Werkstukcijferkolom
            - Advieskolom
            - PeriodeGemiddeldeKolom
            - RapportGemiddeldeKolom
            - RapportCijferKolom
            - RapportToetskolom
            - SEGemiddeldeKolom
            - ToetssoortGemiddeldeKolom
    resultaatAdditionalsVak:
      name: additional
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - vaknaam
            - resultaatkolom
            - heeftalternatiefniveau
            - naamalternatiefniveau
            - naamstandaardniveau
            - leerjaar
            - periodeAfkorting
    resultaatTypesVakExamen:
      name: type
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - Toetskolom
            - SamengesteldeToetsKolom
            - Werkstukcijferkolom
            - Advieskolom
            - PeriodeGemiddeldeKolom
            - RapportGemiddeldeKolom
            - RapportCijferKolom
            - RapportToetskolom
            - SEGemiddeldeKolom
            - ToetssoortGemiddeldeKolom
    resultaatAdditionalsVakExamen:
      name: additional
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - vaknaam
            - resultaatkolom
            - heeftalternatiefniveau
            - naamalternatiefniveau
            - naamstandaardniveau
            - leerjaar

  schemas:
    TokenRequest:
      oneOf:
        - $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
        - $ref: '#/components/schemas/RefreshTokenRequest'

    AuthorizationCodeTokenRequest:
      type: object
      x-observed: true
      required: [grant_type, code, redirect_uri, code_verifier, client_id]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          example: https://leerling.somtoday.nl/oauth/callback
        code_verifier:
          type: string
        client_id:
          type: string
          example: somtoday-leerling-web
        claims:
          type: string
          description: JSON claim request. Observed id_token claims are given_name, leerlingen, orgname, affiliation (student and parent/guardian).

    RefreshTokenRequest:
      type: object
      x-observed: false
      description: Body built by the web client. No live refresh POST was captured.
      required: [grant_type, refresh_token, client_id]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string
          example: somtoday-leerling-web
        scope:
          type: string
          example: openid
        claims:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        id_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3599
        scope:
          type: string
          example: openid
        somtoday_api_url:
          type: string
          example: https://api.somtoday.nl
        somtoday_oop_url:
          type: string
          example: https://oop.somtoday.nl
        somtoday_organisatie_afkorting:
          type: string
        somtoday_tenant:
          type: string
          description: Copied by the client when the token JSON includes it. Not present on the sampled token response.

    Link:
      type: object
      properties:
        id:
          type: integer
          format: int64
        rel:
          type: string
          example: self
        type:
          type: string
        href:
          type: string
          format: uri

    Permission:
      type: object
      properties:
        full:
          type: string
        type:
          type: string
        operations:
          type: array
          items:
            type: string
            enum: [READ, UPDATE, DELETE]
        instances:
          type: array
          items:
            type: string

    Resource:
      type: object
      x-observed: true
      properties:
        $type:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        additionalObjects:
          type: object
          additionalProperties: true

    ItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'

    LongWrapper:
      type: object
      x-observed: true
      properties:
        $type:
          type: string
          example: wrappers.LongWrapper
        values:
          type: array
          items:
            type: integer
            format: int64

    Adres:
      type: object
      x-observed: true
      properties:
        $type:
          type: string
          example: adres.RAdres
        straat:
          type: string
        huisnummer:
          type: string
        plaatsnaam:
          type: string
        postcode:
          type: string
        land:
          type: string
        isBuitenlandsAdres:
          type: boolean

    EloRestricties:
      type: object
      x-observed: true
      description: Feature flags for one student on this parent account
      properties:
        $type:
          type: string
          example: restricties.REloRestricties
        vestigingsId:
          type: integer
          format: int64
        leerlingId:
          type: integer
          format: int64
        mobieleAppAan:
          type: boolean
        studiewijzerAan:
          type: boolean
        berichtenVerzendenAan:
          type: boolean
        leermiddelenAan:
          type: boolean
        adviezenTokenAan:
          type: boolean
        opmerkingRapportCijferTonenAan:
          type: boolean
        periodeGemiddeldeTonenResultaatAan:
          type: boolean
        rapportGemiddeldeTonenResultaatAan:
          type: boolean
        rapportCijferTonenResultaatAan:
