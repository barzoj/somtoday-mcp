openapi: 3.0.3
info:
  title: Somtoday ouderportaal API
  version: 0.2.0
  description: |
    Read-only reconstruction of the API used by the Somtoday parent portal
    (`https://leerling.somtoday.nl`, app title "Somtoday Leerling & Ouder",
    bundle version 2.24.0). This is not the partner Connect API.

    Observed against productie on 2026-10-10 with a parent/guardian session
    (`affiliation: parent/guardian`) for one linked student. Personal values
    are not included. Schemas marked with `x-observed: true` were taken from
    live GET responses. Operations marked `x-observed: false` exist in the
    web client and were not called.

    ## Auth

    Authorization code + PKCE against `https://inloggen.somtoday.nl`.
    Public client `somtoday-leerling-web`. No client secret.

    The access token lasts about 3600 seconds (`expires_in`). The token
    response also returns a `refresh_token`. No live refresh POST was
    captured. The web client (angular-oauth2-oidc, `useSilentRefresh` false,
    `responseType` code) posts `grant_type=refresh_token` to the same token
    endpoint. That body is specified with `x-observed: false`.

    API calls send:

    - `Authorization: Bearer {access_token}`
    - `Accept: application/vnd.topicus.platinum+json; charset=utf-8`
    - `Content-Type: application/vnd.topicus.platinum+json; charset=utf-8`

    ## Envelope

    Most bodies are Topicus/Platinum resources:

    - `$type` is a Java-style type name (`leerling.RLeerling`, `auth.RAccount`, …)
    - `links[]` with `id`, `rel`, `type`, `href`
    - `permissions[]` with `operations` such as `READ` and `UPDATE`
    - `additionalObjects` holds expansions requested with repeated `additional`
    - lists are `{ "items": [ ... ] }`
    - some scalars are wrappers, e.g. `{ "$type": "wrappers.LongWrapper", "values": [0] }`
    - null fields are often omitted
    - collections may return **206** with `Content-Range: items {start}-{end}/{total}`

    ## Parent feature flags

    `GET /account/me?additional=restricties` returns one
    `restricties.REloRestricties` per linked student. Those booleans are what
    the portal uses to show or hide sections. On the observed school,
    `magAbsentiemeldingMaken` was false and the absence form said the school
    has no absence reasons configured. `berichtenVerzendenAan` was false.

    ## Portal routes that drive these calls

    `/`, `/start`, `/vandaag` (redirects to start), `/rooster`, `/studiewijzer`,
    `/cijfers`, `/cijfers/vakgemiddelden`, `/cijfers/overzicht`,
    `/cijfers/vakresultaten?vak&lichting&plaatsing&vaknaam`,
    `/afwezigheid`, `/afwezigheid/melden`, `/berichten/postvak-in`,
    `/berichten/verzonden-items`, `/berichten/nieuw`, `/berichten/edit`,
    `/schoolinformatie`, `/schoolinformatie?pagina={id}|-1|-2`,
    `/verzoeken`, `/ouderavond/{id}`, `/nieuwsbericht/{id}`,
    settings dialog (Mijn gegevens, Weergave, Notificaties, Toestemmingen).

    Inleveropdrachten and Studiemateriaal are dialogs on `/studiewijzer`,
    not separate routes. Inbox vs sent mail is filtered in the client from
    the same conversations call.

servers:
  - url: https://api.somtoday.nl/rest/v1
    description: Productie portal API
  - url: https://inloggen.somtoday.nl
    description: Identity provider. Only the OAuth paths use this server.

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: account
  - name: leerling
  - name: rooster
  - name: studiewijzer
  - name: cijfers
  - name: afwezigheid
  - name: berichten
  - name: nieuws
  - name: school
  - name: verzoeken
  - name: toestemming

paths:
  /oauth2/token:
    servers:
      - url: https://inloggen.somtoday.nl
    post:
      tags: [auth]
      operationId: exchangeAuthorizationCode
      security: []
      x-observed: true
      summary: Exchange an authorization code or refresh an access token
      description: |
        `authorization_code` was observed live. `refresh_token` is the body
        built by the web client and was not posted during sampling.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens plus the API base URL for this organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /.well-known/openid-configuration:
    servers:
      - url: https://inloggen.somtoday.nl
    get:
      tags: [auth]
      operationId: openIdConfiguration
      security: []
      x-observed: true
      summary: OpenID discovery document
      responses:
        '200':
          description: Discovery document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /oauth2/jwks.json:
    servers:
      - url: https://inloggen.somtoday.nl
    get:
      tags: [auth]
      operationId: jsonWebKeySet
      security: []
      x-observed: true
      summary: Signing keys for id and access tokens
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /account/me:
    get:
      tags: [account]
      operationId: getCurrentAccount
      x-observed: true
      summary: Current parent account
      parameters:
        - $ref: '#/components/parameters/additional'
        - name: dummy-param-account
          in: query
          description: Cache-buster set to the account UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account. Not wrapped in `items`.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/Account'

  /accountsettings:
    get:
      tags: [account]
      operationId: getAccountSettings
      x-observed: true
      summary: Push and email notification toggles
      responses:
        '200':
          description: One settings resource
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/AccountSettingsList'
    put:
      tags: [account]
      operationId: putAccountSettings
      x-observed: false
      summary: Update notification toggles
      requestBody:
        required: true
        content:
          application/vnd.topicus.platinum+json:
            schema:
              $ref: '#/components/schemas/AccountSettings'
      responses:
        '200':
          description: Updated settings

  /accountdevices:
    put:
      tags: [account]
      operationId: registerDevice
      x-observed: false
      summary: Register this device for push
      responses:
        '200':
          description: Registered
    delete:
      tags: [account]
      operationId: unregisterDevice
      x-observed: false
      summary: Revoke push registration on logout
      responses:
        '200':
          description: Removed

  /account/deimpersonate:
    post:
      tags: [account]
      operationId: deimpersonate
      x-observed: false
      summary: Leave an impersonated session
      responses:
        '200':
          description: Impersonation ended

  /icalendar:
    get:
      tags: [account]
      operationId: getIcsLink
      x-observed: false
      summary: Personal calendar feed link
      description: Hidden when `roosterBeschikbaarIcalAan` is false.
      responses:
        '200':
          description: ICS link resource
    delete:
      tags: [account]
      operationId: deleteIcsLink
      x-observed: false
      summary: Revoke the calendar feed link
      responses:
        '200':
          description: Revoked

  /appinfo/leerling/supported:
    get:
      tags: [account]
      operationId: supportedAppVersion
      x-observed: false
      summary: Minimum supported app version, plain text
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
            enum: [text/plain]
      responses:
        '200':
          description: Version string
          content:
            text/plain:
              schema:
                type: string

  /leerlingen/{leerlingId}:
    get:
      tags: [leerling]
      operationId: getLeerling
      x-observed: true
      summary: Linked student
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/additional'
      responses:
        '200':
          description: Student. `additional=stamgroep` was requested at startup.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/Leerling'

  /leerlingen/verzorger/schoolgegevens:
    get:
      tags: [leerling, school]
      operationId: getSchoolgegevens
      x-observed: true
      summary: School contact details and the student's placement summary
      description: Loaded by Schoolinformatie pagina=-2 and by the absence form.
      responses:
        '200':
          description: Array of one school-and-placement summary per linked student. Not wrapped in `items`.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schoolgegevens'

  /leerlingen/contactgegevens:
    put:
      tags: [leerling]
      operationId: updateLeerlingContact
      x-observed: false
      summary: Update the student's mobile number and email
      description: Allowed only when the matching restrictie flags are true.
      requestBody:
        required: true
        content:
          application/vnd.topicus.platinum+json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Updated

  /verzorgers/contactgegevens:
    put:
      tags: [account]
      operationId: updateVerzorgerContact
      x-observed: false
      summary: Update the parent's mobile number and email
      requestBody:
        required: true
        content:
          application/vnd.topicus.platinum+json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Updated

  /mededelingen:
    get:
      tags: [nieuws]
      operationId: listMededelingen
      x-observed: true
      summary: Platform announcements
      responses:
        '200':
          description: Announcements. Empty on the observed day.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /communicatie/nieuwsberichten/ontvangen:
    get:
      tags: [nieuws]
      operationId: listNieuwsberichten
      x-observed: true
      summary: News items for the parent
      parameters:
        - $ref: '#/components/parameters/amount'
        - $ref: '#/components/parameters/start'
      responses:
        '200':
          description: News page
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /communicatie/nieuwsberichten/ontvangen/aantalongelezen:
    get:
      tags: [nieuws]
      operationId: unreadNieuwsCount
      x-observed: true
      summary: Unread news count
      responses:
        '200':
          description: Count wrapper or small object
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/Resource'

  /communicatie/nieuwsberichten/ontvangen/{id}:
    get:
      tags: [nieuws]
      operationId: getNieuwsbericht
      x-observed: false
      summary: One news item
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: News item

  /communicatie/nieuwsberichten/ontvangen/{id}/content:
    get:
      tags: [nieuws]
      operationId: getNieuwsberichtContent
      x-observed: false
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: HTML or text content

  /afspraakitems/{leerlingId}/jaar/{jaar}/week/{week}:
    get:
      tags: [rooster]
      operationId: getWeekRooster
      x-observed: true
      summary: Lessons for one ISO week
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/jaar'
        - $ref: '#/components/parameters/week'
      responses:
        '200':
          description: Appointments for that week, plus a root `statusNotifications` array.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/AfspraakWeek'

  /afspraakitems/herhalingsinfo/{afspraakId}/{leerlingId}:
    get:
      tags: [rooster]
      operationId: getAfspraakHerhaling
      x-observed: false
      parameters:
        - name: afspraakId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/leerlingId'
      responses:
        '200':
          description: Recurrence info

  /afspraakitems/uitvoeren:
    post:
      tags: [rooster]
      operationId: uitvoerenAfspraak
      x-observed: false
      summary: Mark a planned item done
      responses:
        '200':
          description: Updated

  /vakanties/verzorger:
    get:
      tags: [rooster, school]
      operationId: listVakantiesVerzorger
      x-observed: true
      summary: Holidays and days off for the parent
      description: Also used by Schoolinformatie pagina=-1.
      responses:
        '200':
          description: Holiday list
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /maatregeltoekenningen/actief/{leerlingId}:
    get:
      tags: [afwezigheid]
      operationId: listActieveMaatregelen
      x-observed: true
      summary: Active measures for the student
      parameters:
        - $ref: '#/components/parameters/leerlingId'
      responses:
        '200':
          description: Measures
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /studiewijzeritemafspraaktoekenningen:
    get:
      tags: [studiewijzer]
      operationId: listAfspraakToekenningen
      x-observed: true
      summary: Homework attached to a lesson in a week
      parameters:
        - $ref: '#/components/parameters/leerlingFilter'
        - $ref: '#/components/parameters/jaarWeek'
        - $ref: '#/components/parameters/studiewijzerAdditionals'
      responses:
        '206':
          description: "Partial list. Observed Content-Range items 0-15/16."
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/AfspraakToekenningList'

  /studiewijzeritemdagtoekenningen:
    get:
      tags: [studiewijzer]
      operationId: listDagToekenningen
      x-observed: true
      summary: Day tasks, or all hand-in tasks
      description: |
        Week view sends `jaarWeek`. The Inleveropdrachten dialog instead sends
        `studiewijzerItem.heeftInleverperiode=true` and no week.
      parameters:
        - $ref: '#/components/parameters/leerlingFilter'
        - $ref: '#/components/parameters/jaarWeekOptional'
        - name: studiewijzerItem.heeftInleverperiode
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/studiewijzerAdditionals'
      responses:
        '206':
          description: Partial list of day tasks (`studiewijzer.RSWIDagToekenning`).
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/DagToekenningList'

  /studiewijzeritemweektoekenningen:
    get:
      tags: [studiewijzer]
      operationId: listWeekToekenningen
      x-observed: true
      summary: Week tasks
      parameters:
        - $ref: '#/components/parameters/leerlingFilter'
        - name: weeknummer
          in: query
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/studiewijzerAdditionals'
      responses:
        '206':
          description: Partial list of week tasks (`studiewijzer.RSWIWeekToekenning`).
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/WeekToekenningList'

  /studiewijzeritemdagtoekenningen/{toekenningId}/inleveren:
    post:
      tags: [studiewijzer]
      operationId: leverIn
      x-observed: false
      summary: Hand in files or URLs for a day task
      parameters:
        - name: toekenningId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.topicus.platinum+json:
            schema:
              type: object
              properties:
                bestandIds:
                  type: array
                  items:
                    type: string
                urls:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Hand-in accepted

  /studiewijzeritemdagtoekenningen/inleverdetails/{toekenningId}:
    get:
      tags: [studiewijzer]
      operationId: getInleverDetails
      x-observed: false
      parameters:
        - name: toekenningId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hand-in status

  /studiewijzeritemdagtoekenningen/{toekenningId}/verstuurReactieLeerling:
    post:
      tags: [studiewijzer]
      operationId: verstuurReactie
      x-observed: false
      parameters:
        - name: toekenningId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment stored

  /vakken/studiemateriaal/{leerlingId}:
    get:
      tags: [studiewijzer]
      operationId: listStudiemateriaalVakken
      x-observed: true
      summary: Subjects that have study material
      parameters:
        - $ref: '#/components/parameters/leerlingId'
      responses:
        '200':
          description: Subject list
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/VakList'

  /studiemateriaal/{leerlingId}/vak/{vakUuid}:
    get:
      tags: [studiewijzer]
      operationId: getStudiemateriaal
      x-observed: true
      summary: Lesson material for one subject
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/vakUuid'
      responses:
        '200':
          description: Study guide plus lesson-material assignments
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/StudieMateriaal'

  /vakkeuzes:
    get:
      tags: [cijfers]
      operationId: listVakkeuzes
      x-observed: true
      summary: Subject choices active on a date
      parameters:
        - name: actiefOpPeildatum
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: leerling
          in: query
          required: true
          schema:
            type: string
      responses:
        '206':
          description: Partial list of subject choices
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /plaatsingen:
    get:
      tags: [cijfers, leerling]
      operationId: listPlaatsingen
      x-observed: true
      summary: Placements for the student
      parameters:
        - name: leerling
          in: query
          required: true
          schema:
            type: string
      responses:
        '206':
          description: Placements. Observed Content-Range items 0-0/1.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/PlaatsingList'

  /vakkeuzes/plaatsing/{plaatsingUuid}/vakgemiddelden:
    get:
      tags: [cijfers]
      operationId: listVakgemiddelden
      x-observed: true
      summary: Report averages per subject for a placement
      parameters:
        - $ref: '#/components/parameters/plaatsingUuid'
      responses:
        '200':
          description: Averages. Root `$type` is `resultaten.RLeerlingVakGemiddelden`. Not an `items` list.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/Vakgemiddelden'

  /resultaatpublicatiemomenten/volgende/leerling/{leerlingId}:
    get:
      tags: [cijfers]
      operationId: volgendePublicatiemoment
      x-observed: true
      summary: Next grade publication moment
      parameters:
        - $ref: '#/components/parameters/leerlingId'
      responses:
        '200':
          description: Publication moment

  /geldendvoortgangsdossierresultaten/leerling/{leerlingId}:
    get:
      tags: [cijfers]
      operationId: listVoortgangsresultaten
      x-observed: true
      summary: Latest progress-dossier results
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/resultaatTypesRecent'
        - $ref: '#/components/parameters/resultaatAdditionalsRecent'
        - $ref: '#/components/parameters/resultaatSort'
      responses:
        '206':
          description: Recent results, newest first. Sampled items were all `type=Toetskolom`.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/GeldendResultaatList'

  /geldendexamendossierresultaten/leerling/{leerlingId}:
    get:
      tags: [cijfers]
      operationId: listExamenresultaten
      x-observed: true
      summary: Latest exam-dossier results
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/resultaatTypesRecent'
        - $ref: '#/components/parameters/resultaatAdditionalsRecent'
        - $ref: '#/components/parameters/resultaatSort'
      responses:
        '206':
          description: Recent exam results
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /geldendvoortgangsdossierresultaten/vakresultaten/{leerlingId}/vak/{vakUuid}/lichting/{lichtingUuid}:
    get:
      tags: [cijfers]
      operationId: voortgangVakresultaten
      x-observed: true
      summary: All progress results for one subject and cohort
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/vakUuid'
        - $ref: '#/components/parameters/lichtingUuid'
        - $ref: '#/components/parameters/resultaatTypesVak'
        - $ref: '#/components/parameters/resultaatAdditionalsVak'
        - $ref: '#/components/parameters/resultaatSort'
      responses:
        '200':
          description: Subject results. Same result object as the latest-results list, with period and level names in `additionalObjects`.
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/GeldendResultaatList'

  /geldendexamendossierresultaten/vakresultaten/{leerlingId}/vak/{vakUuid}/lichting/{lichtingUuid}:
    get:
      tags: [cijfers]
      operationId: examenVakresultaten
      x-observed: true
      summary: All exam results for one subject and cohort
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - $ref: '#/components/parameters/vakUuid'
        - $ref: '#/components/parameters/lichtingUuid'
        - $ref: '#/components/parameters/resultaatTypesVakExamen'
        - $ref: '#/components/parameters/resultaatAdditionalsVakExamen'
        - $ref: '#/components/parameters/resultaatSort'
      responses:
        '200':
          description: Exam subject results
          content:
            application/vnd.topicus.platinum+json:
              schema:
                $ref: '#/components/schemas/ItemList'

  /geldendexamendossierresultaten/leerling/context/{leerlingId}:
    get:
      tags: [cijfers]
      operationId: examenContext
      x-observed: true
      summary: Exam-dossier context for the grade overview
      parameters:
        - $ref: '#/components/parameters/leerlingId'
      responses:
        '200':
          description: Context

  /geldendvoortgangsdossierresultaten/leerling/cijferoverzicht/{leerlingId}:
    get:
      tags: [cijfers]
      operationId: cijferoverzicht
      x-observed: true
      summary: Grade grid for a placement
      parameters:
        - $ref: '#/components/parameters/leerlingId'
        - name: plaatsing
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Overview grid. Root `$type` is `resultaten.RLeerlingVoortgangResultaten`.
          content:
            application/vnd.topicus.platinum+json:
